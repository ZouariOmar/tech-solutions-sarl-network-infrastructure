! ZouariOmar <zouariomar20@gmail.com>
! Since:         2025-11-19
! LastUpdate:    2026-01-05
! RouterName:    R-nfs
! RouterVersion: C3745
! COPY-THAN-PASTE

conf t
hostname R-nfs

! ============================
! ===== INTERFACES PART ======
! === F0/1(WAN) - F0/0(LAN) ==
! ============================

! === FastEthernet0/1 (WAN) ===
interface fa0/1
  description R-nfs to UDP Tunnel
  ip address 10.0.0.2 255.255.255.0
  no shutdown
  exit

! === FastEthernet0/0 (LAN) ===
interface fa0/0
  description R-nfs to SW1
  ip address 172.24.74.1 255.255.255.0
  no shutdown
  exit

! ============================
! ====== SERVICES PART =======
! ==== OSPF - DHCP - DNS =====
! ============================

! === OSPF ===
router ospf 1
  router-id 7.7.7.7
  network 10.0.0.0 0.0.0.255 area 0
  network 172.24.74.0 0.0.0.255 area 0
  passive-interface default
  no passive-interface FastEthernet0/1
  ! NOTE: `f0/0` should not be no `passive-interface`
  default-information originate
  exit

! Default route toward backbone
ip route 0.0.0.0 0.0.0.0 10.0.0.1

! === DHCP ===
ip dhcp pool NFS-DHCP
  network 172.24.74.0 255.255.255.0
  default-router 172.24.74.1
  dns-server 8.8.8.8
  exit

! Exclude @GW
ip dhcp excluded-address 172.24.74.1

! Exclude @NFS-server
ip dhcp excluded-address 172.24.74.2

! === DNS ===
ip domain-lookup
  ip name-server 8.8.8.8

! ==================================
! ========= SECURITY PART ==========
! == CONSOLE - SSH - TELNET - ACL ==
! ==================================

! Create an Admin user
username admin privilege 15 secret <STRONG_PASSWORD>

! Encrypt all passwords
service password-encryption

! === Console ===
line console 0
  login local
  exec-timeout 5 0    ! Auto-logout after 5min
  logging synchronous ! Clean console display
  exit

! === SSH ===
crypto key generate rsa usage-keys label SSH modulus 2048
ip ssh version 2
! ip access-list standard SSH_ONLY
!   permit X.X.X.X X.X.X.X
!   deny any
line vty 0 4
  login local
  transport input ssh
! access-class SSH_ONLY in
  exec-timeout 5 0
  logging synchronous
  exit

! === Telnet ===
! ip access-list standard TELNET_ONLY
!   permit 10.0.0.0 0.0.0.255
!   deny any
line vty 5 15
  login local
  transport input telnet
! access-class TELNET_ONLY in
  exec-timeout 5 0
  logging synchronous
  end

! Disable unused services
! no ip http server          ! HTTP
! no ip http secure-server   ! HTTPS
! no cdp run                 ! CDP

write

! =========================
! === VERIFICATION PART ===
! =========================

! === OSPF Interfaces ===
! Check which interfaces run OSPF and their state
show ip ospf interface brief
show ip ospf interface
show ip protocols

! === OSPF Interfaces ===
! Verify adjacency with other routers (if backbone is up)
show ip ospf neighbor
show ip ospf neighbor detail

! === OSPF Routes ===
! Verify OSPF learned routes
show ip route ospf
show ip route

! === Default Route / Redistribution ===
! Check default route advertisement
show ip route 0.0.0.0
show running-config | include default-information

! === LAN Connectivity / DHCP ===
! Verify DHCP bindings and pool
show ip dhcp binding
show ip dhcp pool

! === DNS Resolution ===
! Verify DNS lookup from router
ping 8.8.8.8
ping www.google.com
