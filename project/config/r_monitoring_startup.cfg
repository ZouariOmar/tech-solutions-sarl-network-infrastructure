! ZouariOmar <zouariomar20@gmail.com>
! Since:         2025-11-19
! LastUpdate:    2026-01-05
! RouterName:    R-MONITORING
! RouterVersion: C3745
! COPY-THAN-PASTE

conf t
hostname R-MONITORING

! ============================
! ===== INTERFACES PART ======
! === F0/1(WAN) - F0/0(LAN) ==
! ============================

! === FastEthernet0/1 (WAN) ===
interface FastEthernet0/1
  description R-MONITORING to UDP Tunnel (RZ-1)
  ip address 10.3.0.6 255.255.255.252
  no shutdown
  exit

! === FastEthernet0/0 (LAN) ===
interface FastEthernet0/0
  description LAN MONITORING
  ip address 172.24.64.1 255.255.192.0
  no shutdown
  exit

! Shutdown unused interfaces
interface range Serial0/0 , Serial0/1 , Serial0/2 , Serial2/0 - 2/3 , FastEthernet1/0
  shutdown
  exit

! ============================
! ====== SERVICES PART =======
! ==== OSPF - DHCP - DNS =====
! ============================

! === OSPF ===
router ospf 1
  router-id 10.3.0.6
  log-adjacency-changes
  network 10.3.0.4 0.0.0.3 area 0
  network 172.24.64.0 0.0.63.255 area 0
  passive-interface default
  no passive-interface FastEthernet0/1
  default-information originate
  exit

! Default route toward backbone
ip route 0.0.0.0 0.0.0.0 10.3.0.5

! === DHCP ===
ip dhcp excluded-address 172.24.64.1 172.24.64.20
ip dhcp excluded-address 172.24.127.255

ip dhcp pool RZ-MONITORING
  network 172.24.64.0 255.255.192.0
  default-router 172.24.64.1
  dns-server 8.8.8.8
  domain-name monitoring.techsolutions
  exit

! === DNS ===
ip domain-lookup
ip name-server 8.8.8.8
ip name-server 1.1.1.1

! ==================================
! ========= SECURITY PART ==========
! == CONSOLE - SSH - TELNET - ACL ==
! ==================================

! Create an Admin user
username admin privilege 15 secret <STRONG_PASSWORD>

! Encrypt all passwords
service password-encryption

! === Console ===
line console 0
  login local
  exec-timeout 5 0
  logging synchronous
  exit

! === SSH ===
crypto key generate rsa usage-keys label SSH modulus 2048
ip ssh version 2
line vty 0 4
  login local
  transport input ssh
  exec-timeout 5 0
  logging synchronous
  exit

! === Telnet ===
line vty 5 15
  login local
  transport input telnet
  exec-timeout 5 0
  logging synchronous
  exit

! Disable unused services
! no ip http server
! no ip http secure-server
! no cdp run

write

! =========================
! === VERIFICATION PART ===
! =========================

! === OSPF Interfaces ===
show ip ospf interface brief
show ip ospf interface
show ip protocols

! === OSPF Interfaces ===
show ip ospf neighbor
show ip ospf neighbor detail

! === OSPF Routes ===
show ip route ospf
show ip route

! === Default Route / Redistribution ===
show ip route 0.0.0.0
show running-config | include default-information

! === LAN Connectivity / DHCP ===
show ip dhcp binding
show ip dhcp pool

! === DNS Resolution ===
ping 8.8.8.8
ping www.google.com
