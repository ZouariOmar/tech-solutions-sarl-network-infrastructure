! Dummy Firewall configuration (fortigate)
config system interface
edit "port1"
    set mode static
    set ip 10.0.0.254 255.255.255.0
    set allowaccess ping
next
edit "port2"
    set mode static
    set ip 10.0.0.253 255.255.255.0
    set allowaccess ping
next
end

config firewall policy
edit 1
    set name "Cloud-to-Router"
    set srcintf "port1"
    set dstintf "port2"
    set srcaddr "all"
    set dstaddr "all"
    set action accept
    set schedule "always"
    set service ALL
    set nat disable
next
edit 2
    set name "Router-to-Cloud"
    set srcintf "port2"
    set dstintf "port1"
    set srcaddr "all"
    set dstaddr "all"
    set action accept
    set schedule "always"
    set service ALL
    set nat disable
next
end

execute factoryreset

