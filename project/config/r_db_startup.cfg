! Since:         2025-12-23
! LastUpdate:    2026-01-05
! RouterName:    R-db
! RouterVersion: C3745
! COPY-THAN-PASTE

conf t
hostname R-db

! ============================
! ===== INTERFACES PART ======
! === F0/1(WAN) - F0/0(LAN) ==
! ============================

! === FastEthernet0/1 (WAN) ===
interface FastEthernet0/1
  description R-db to UDP Tunnel / Backbone
  ip address 10.1.0.2 255.255.255.252
  no shutdown
  exit

! === FastEthernet0/0 (LAN) ===
interface FastEthernet0/0
  description R-db to DB-LAN
  ip address 172.24.72.1 255.255.254.0
  no shutdown
  exit

! ============================
! ====== SERVICES PART =======
! ==== OSPF - DHCP - DNS =====
! ============================

! === OSPF ===
router ospf 1
  router-id 6.6.6.6
  log-adjacency-changes
  network 10.1.0.0 0.0.0.3 area 0
  network 172.24.72.0 0.0.1.255 area 0
  passive-interface default
  no passive-interface FastEthernet0/1
  default-information originate
  exit

! Default route toward backbone
ip route 0.0.0.0 0.0.0.0 10.1.0.1

! === DHCP ===
! Excluded addresses
ip dhcp excluded-address 172.24.72.1 172.24.72.2

ip dhcp pool DB-LAN
  network 172.24.72.0 255.255.254.0
  default-router 172.24.72.1
  dns-server 8.8.8.8
  exit

! === DNS ===
ip domain-lookup
ip name-server 8.8.8.8
ip name-server 1.1.1.1

! ============================
! ====== SECURITY PART =======
! CONSOLE - SSH - TELNET - ACL
! ============================

! Create Admin user
username admin privilege 15 secret <STRONG_PASSWORD>

! Encrypt all passwords
service password-encryption

! === Console ===
line console 0
  login local
  exec-timeout 5 0
  logging synchronous
  exit

! === SSH ===
crypto key generate rsa usage-keys label SSH modulus 2048
ip ssh version 2

line vty 0 4
  login local
  transport input ssh
  exec-timeout 5 0
  logging synchronous
  exit

! === Telnet (optional / legacy) ===
line vty 5 15
  login local
  transport input telnet
  exec-timeout 5 0
  logging synchronous
  end

! Disable unused services
no ip http server
no ip http secure-server
! no cdp run

write

! =========================
! === VERIFICATION PART ===
! =========================

! === OSPF Interfaces ===
! Check which interfaces run OSPF and their state
show ip ospf interface brief
show ip ospf interface
show ip protocols

! === OSPF Interfaces ===
! Verify adjacency with other routers (if backbone is up)
show ip ospf neighbor
show ip ospf neighbor detail

! === OSPF Routes ===
! Verify OSPF learned routes
show ip route ospf
show ip route

! === Default Route / Redistribution ===
! Check default route advertisement
show ip route 0.0.0.0
show running-config | include default-information

! === LAN Connectivity / DHCP ===
! Verify DHCP bindings and pool
show ip dhcp binding
show ip dhcp pool

! === DNS Resolution ===
! Verify DNS lookup from router
ping 8.8.8.8
ping www.google.com
